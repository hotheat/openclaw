name: AI Code Review

"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex_review:
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.CODEX_REVIEW_TIMEOUT_MINUTES || '8') }}
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build trusted review prompt
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git show "${PR_BASE_SHA}:.github/codex/prompts/review.md" > .codex-review-prompt.md
          {
            printf '\n\n'
            printf 'Base branch ref: origin/%s\n' "${PR_BASE_REF}"
            printf 'Base branch commit at PR event: %s\n' "${PR_BASE_SHA}"
            printf 'Head commit: %s\n' "${PR_HEAD_SHA}"
            printf 'Checked out commit: %s\n\n' "$(git rev-parse HEAD)"
            printf 'Review exactly %s...%s. Do not substitute the current base branch tip.\n' "${PR_BASE_SHA}" "${PR_HEAD_SHA}"
            printf 'Review this pull request and produce a concise markdown report.\n'
          } >> .codex-review-prompt.md

      - name: Run Codex review
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.CODEX_TOKEN }}
          responses-api-endpoint: ${{ vars.CODEX_RESPONSES_API_ENDPOINT }}
          model: ${{ vars.CODEX_MODEL }}
          effort: ${{ vars.CODEX_MODEL_REASONING_EFFORT }}
          prompt-file: .codex-review-prompt.md
          output-file: codex-review.md
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-version: ${{ vars.CODEX_VERSION }}
          codex-args: '["--ephemeral", "--config", "disable_response_storage=true", "--config", "personality=\"pragmatic\""]'

  post_codex_review:
    needs: codex_review
    if: needs.codex_review.outputs.final_message != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Comment review on pull request
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex_review.outputs.final_message }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- codex-review -->';
            const review = process.env.CODEX_FINAL_MESSAGE.trim();
            if (!review) {
              core.info('No review output generated by Codex.');
              return;
            }
            const body = `${marker}\n${review}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

  claudecode_review:
    if: >
      vars.CLAUDECODE_REVIEW_ENABLED == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.CLAUDECODE_REVIEW_TIMEOUT_MINUTES || '8') }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.ANTHROPIC_DEFAULT_OPUS_MODEL }}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}
      CLAUDE_CODE_EFFORT_LEVEL: ${{ vars.CLAUDE_CODE_EFFORT_LEVEL }}
      CLAUDECODE_REVIEW_TIMEOUT_MINUTES: ${{ vars.CLAUDECODE_REVIEW_TIMEOUT_MINUTES || '8' }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Claude Code
        env:
          CLAUDE_CODE_VERSION: latest
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_AUTH_TOKEN}" ]; then
            echo "ANTHROPIC_AUTH_TOKEN is empty"
            exit 1
          fi
          if [ -z "${ANTHROPIC_BASE_URL}" ]; then
            echo "ANTHROPIC_BASE_URL is empty"
            exit 1
          fi
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          echo "$(npm prefix --global)/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.claude"
          cat > "$HOME/.claude/settings.json" <<EOF
          {
            "env": {
              "ANTHROPIC_AUTH_TOKEN": "${ANTHROPIC_AUTH_TOKEN}",
              "ANTHROPIC_API_KEY": "${ANTHROPIC_AUTH_TOKEN}",
              "ANTHROPIC_BASE_URL": "${ANTHROPIC_BASE_URL}",
              "ANTHROPIC_DEFAULT_HAIKU_MODEL": "${ANTHROPIC_DEFAULT_HAIKU_MODEL}",
              "ANTHROPIC_DEFAULT_OPUS_MODEL": "${ANTHROPIC_DEFAULT_OPUS_MODEL}",
              "ANTHROPIC_DEFAULT_SONNET_MODEL": "${ANTHROPIC_DEFAULT_SONNET_MODEL}",
              "CLAUDE_CODE_EFFORT_LEVEL": "${CLAUDE_CODE_EFFORT_LEVEL}",
              "API_TIMEOUT_MS": "600000",
              "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1"
            },
            "permissions": {
              "allow": [],
              "deny": []
            },
            "model": "opus[1m]",
            "enabledPlugins": {
              "document-skills@anthropic-agent-skills": false,
              "example-skills@anthropic-agent-skills": true,
              "pyright-lsp@claude-plugins-official": true,
              "superpowers@superpowers-dev": true,
              "typescript-lsp@claude-plugins-official": true
            },
            "skipDangerousModePermissionPrompt": true
          }
          EOF
          chmod 600 "$HOME/.claude/settings.json"

      - name: Run Claude Code review
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PROMPT="$(cat .github/codex/prompts/review.md)"
          CLAUDECODE_COMMAND_TIMEOUT_MINUTES=$((CLAUDECODE_REVIEW_TIMEOUT_MINUTES - 1))
          if [ "${CLAUDECODE_COMMAND_TIMEOUT_MINUTES}" -lt 1 ]; then
            CLAUDECODE_COMMAND_TIMEOUT_MINUTES=1
          fi
          set +e
          timeout "${CLAUDECODE_COMMAND_TIMEOUT_MINUTES}m" claude \
            --settings "$HOME/.claude/settings.json" \
            --dangerously-skip-permissions \
            --output-format text \
            --no-session-persistence \
            -p \
            "${PROMPT}

            Base branch ref: origin/${PR_BASE_REF}
            Base branch commit at PR event: ${PR_BASE_SHA}
            Head commit: ${PR_HEAD_SHA}
            Checked out commit: $(git rev-parse HEAD)

            Review this pull request and produce a concise markdown report." \
            > >(tee claudecode-review.md) \
            2> >(tee claudecode-review.err >&2)
          CLAUDE_EXIT=$?
          set -e
          echo "Claude Code exit code: ${CLAUDE_EXIT}"
          if [ "${CLAUDE_EXIT}" -ne 0 ]; then
            echo "::group::Claude Code stderr"
            cat claudecode-review.err || true
            echo "::endgroup::"
            echo "::group::Claude Code stdout"
            cat claudecode-review.md || true
            echo "::endgroup::"
            if [ "${CLAUDE_EXIT}" -eq 124 ]; then
              printf '%s\n' "Claude Code review skipped: review did not finish within the ${CLAUDECODE_COMMAND_TIMEOUT_MINUTES} minute command timeout." > claudecode-review.md
              echo "::warning::Claude Code review skipped because it exceeded the ${CLAUDECODE_COMMAND_TIMEOUT_MINUTES} minute command timeout."
              exit 0
            fi
            if grep -Eiq "API Error: 529|overloaded|capacity" claudecode-review.err claudecode-review.md; then
              printf '%s\n' "Claude Code review skipped: inference gateway returned a transient capacity error. Re-run this workflow when capacity recovers." > claudecode-review.md
              echo "::warning::Claude Code review skipped because the inference gateway returned a transient capacity error."
              exit 0
            fi
            exit "${CLAUDE_EXIT}"
          fi

      - name: Upload Claude Code debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: claudecode-review-debug
          path: |
            claudecode-review.md
            claudecode-review.err
          if-no-files-found: ignore

      - name: Comment Claude Code review on pull request
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- claudecode-review -->';
            if (!fs.existsSync('claudecode-review.md')) {
              core.info('No Claude Code review output file was generated.');
              return;
            }
            const review = fs.readFileSync('claudecode-review.md', 'utf8').trim();
            if (!review) {
              core.info('No review output generated by Claude Code.');
              return;
            }
            const body = `${marker}\n${review}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

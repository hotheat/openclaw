name: AI Code Review

"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex_review:
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Codex CLI
        env:
          CODEX_TOKEN: ${{ secrets.CODEX_TOKEN }}
          CODEX_API_URL: ${{ secrets.CODEX_API_URL }}
          CODEX_VERSION: 0.117.0
        run: |
          set -euo pipefail
          if [ -z "${CODEX_TOKEN}" ]; then
            echo "CODEX_TOKEN is empty"
            exit 1
          fi
          if [ -z "${CODEX_API_URL}" ]; then
            echo "CODEX_API_URL is empty"
            exit 1
          fi
          npm install --global "@openai/codex@${CODEX_VERSION}"
          echo "$(npm prefix --global)/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.codex"
          cat > "$HOME/.codex/config.toml" <<EOF
          model = "gpt-5.4"
          model_reasoning_effort = "medium"
          preferred_auth_method = "apikey"
          disable_response_storage = true
          personality = "pragmatic"
          model_provider = "sss"

          [model_providers.sss]
          name = "sss"
          base_url = "${CODEX_API_URL}"
          wire_api = "responses"
          env_key = "SSS_API_KEY"
          EOF
          chmod 600 "$HOME/.codex/config.toml"

      - name: Run Codex review
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SSS_API_KEY: ${{ secrets.CODEX_TOKEN }}
          CODEX_API_URL: ${{ secrets.CODEX_API_URL }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"
          PROMPT="$(cat .github/codex/prompts/review.md)"
          codex exec \
            --dangerously-bypass-approvals-and-sandbox \
            --model gpt-5.4 \
            --output-last-message codex-review.md \
            "${PROMPT}

            Base branch ref: origin/${PR_BASE_REF}
            Base branch commit at PR event: ${PR_BASE_SHA}
            Head commit: ${PR_HEAD_SHA}
            Checked out commit: $(git rev-parse HEAD)

            Review this pull request and produce a concise markdown report."

      - name: Comment review on pull request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- codex-review -->';
            const review = fs.readFileSync('codex-review.md', 'utf8').trim();
            if (!review) {
              core.info('No review output generated by Codex.');
              return;
            }
            const body = `${marker}\n${review}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

name: AI Code Review

"on":
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex_review:
    if: >
      vars.CODEX_REVIEW_ENABLED == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: bioinfo-ai-otr/.github/.github/workflows/codex-review.yml@main
    secrets:
      CODEX_TOKEN: ${{ secrets.CODEX_TOKEN }}

  claudecode_review:
    if: >
      vars.CLAUDECODE_REVIEW_ENABLED == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: bioinfo-ai-otr/.github/.github/workflows/claudecode-review.yml@main
    secrets:
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}

  grok_review:
    if: >
      vars.GROK_REVIEW_ENABLED != 'false' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: bioinfo-ai-otr/.github/.github/workflows/grok-review.yml@main
    secrets:
      GROK_TOKEN: ${{ secrets.GROK_TOKEN }}

name: Codex Review

'on':
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex_review:
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Codex CLI
        env:
          CODEX_TOKEN: ${{ secrets.CODEX_TOKEN }}
          CODEX_API_URL: ${{ secrets.CODEX_API_URL }}
        run: |
          if [ -z "${CODEX_TOKEN}" ]; then
            echo "CODEX_TOKEN is empty"
            exit 1
          fi
          if [ -z "${CODEX_API_URL}" ]; then
            echo "CODEX_API_URL is empty"
            exit 1
          fi
          bash -c "$(curl -fsSL https://sssaicode.com/install-codex.sh)"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Run Codex review
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          SSS_API_KEY: ${{ secrets.CODEX_TOKEN }}
          CODEX_API_URL: ${{ secrets.CODEX_API_URL }}
        run: |
          git fetch origin "${PR_BASE_REF}"
          PROMPT="$(cat .github/codex/prompts/review.md)"
          codex exec \
            --dangerously-bypass-approvals-and-sandbox \
            --model gpt-5.4 \
            --output-last-message codex-review.md \
            "${PROMPT}

            Base branch: origin/${PR_BASE_REF}
            Head commit: $(git rev-parse HEAD)

            Review this pull request and produce a concise markdown report."

      - name: Comment review on pull request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('codex-review.md', 'utf8').trim();
            if (!body) {
              core.info('No review output generated by Codex.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

name: CI

on:
  push:
    branches: [otr-integration-v2.22]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run lint, typecheck, and format checks
        run: pnpm check

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Build CLI and gateway bundle
        run: pnpm build

      - name: Smoke test built runtime entrypoints
        run: pnpm smoke:build

      - name: Build Control UI
        run: pnpm ui:build

  test:
    name: test
    runs-on: ubuntu-latest
    needs:
      - check
      - build
    env:
      OPENCLAW_TEST_WORKERS: 2
      OPENCLAW_TEST_MAX_OLD_SPACE_SIZE_MB: 6144
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run test suite
        run: pnpm test:fast

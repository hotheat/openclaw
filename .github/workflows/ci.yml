name: CI

on:
  push:
    branches: [otr-integration-v2.22]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run lint, typecheck, and format checks
        run: pnpm check

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Build CLI and gateway bundle
        run: pnpm build

      - name: Smoke test built runtime entrypoints
        run: pnpm smoke:build

      - name: Build Control UI
        run: pnpm ui:build

  test:
    name: test / shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs:
      - check
      - build
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run fast unit shard
        run: node scripts/run-test-fast-shard.mjs ${{ matrix.shard }}

  test-browser:
    name: test-browser
    runs-on: ubuntu-latest
    needs:
      - check
      - build
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run browser slice
        run: pnpm test:browser -- --silent=passed-only

  test-embedded:
    name: test-embedded
    runs-on: ubuntu-latest
    needs:
      - check
      - build
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run embedded slice
        run: pnpm test:embedded -- --silent=passed-only

  test-triggers:
    name: test-triggers
    runs-on: ubuntu-latest
    needs:
      - check
      - build
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run triggers slice
        run: pnpm test:triggers -- --silent=passed-only

  test-web-auto-reply:
    name: test-web-auto-reply
    runs-on: ubuntu-latest
    needs:
      - check
      - build
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run web auto reply slice
        run: pnpm test:web-auto-reply -- --silent=passed-only

  test-doctor:
    name: test-doctor
    runs-on: ubuntu-latest
    needs:
      - check
      - build
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run doctor slice
        run: pnpm test:doctor-only -- --silent=passed-only

  test-telegram-media:
    name: test-telegram-media
    runs-on: ubuntu-latest
    needs:
      - check
      - build
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run telegram media slice
        run: pnpm test:telegram-media -- --silent=passed-only

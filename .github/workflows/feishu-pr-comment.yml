name: Feishu Notifications

"on":
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  notify_pr_comment:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.type != 'Bot'
    uses: bioinfo-ai-otr/.github/.github/workflows/feishu-pr-comment.yml@609f9c834261f200129fd46824d43709bc290b61
    secrets:
      FEISHU_OAUTH_APP_ID: ${{ secrets.FEISHU_OAUTH_APP_ID }}
      FEISHU_OAUTH_APP_SECRET: ${{ secrets.FEISHU_OAUTH_APP_SECRET }}

  notify_inline_comment:
    if: >
      github.event_name == 'pull_request_review_comment' &&
      github.event.comment.user.type != 'Bot'
    uses: bioinfo-ai-otr/.github/.github/workflows/feishu-pr-comment.yml@609f9c834261f200129fd46824d43709bc290b61
    secrets:
      FEISHU_OAUTH_APP_ID: ${{ secrets.FEISHU_OAUTH_APP_ID }}
      FEISHU_OAUTH_APP_SECRET: ${{ secrets.FEISHU_OAUTH_APP_SECRET }}

  notify_pr_approved:
    if: >
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.review.user.type != 'Bot'
    uses: bioinfo-ai-otr/.github/.github/workflows/feishu-pr-approved.yml@609f9c834261f200129fd46824d43709bc290b61
    secrets:
      FEISHU_OAUTH_APP_ID: ${{ secrets.FEISHU_OAUTH_APP_ID }}
      FEISHU_OAUTH_APP_SECRET: ${{ secrets.FEISHU_OAUTH_APP_SECRET }}

  notify_pr_merged:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    uses: bioinfo-ai-otr/.github/.github/workflows/feishu-pr-merged.yml@609f9c834261f200129fd46824d43709bc290b61
    secrets:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_SIGNING_SECRET: ${{ secrets.FEISHU_SIGNING_SECRET }}
